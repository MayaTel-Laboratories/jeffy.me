name: 'esnupi.me Post Next Image'

on:
  workflow_dispatch:
  schedule:
    - cron: "50 * * * *"

jobs:
  post-next-image:
    name: Post Next Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          filter: blob:none
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !imagequeue

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Poast!!
        env:
          BSKY_IDENTIFIER: ${{ secrets.BSKY_IDENTIFIER }}
          BSKY_PASSWORD: ${{ secrets.BSKY_PASSWORD }}
          GH_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
          LAST_IMAGE_NAME: ${{ vars.LAST_IMAGE_NAME }}
        run: |
          mkdir -p imagequeue
          CURRENT_IMAGE=$(echo "$LAST_IMAGE_NAME" | cut -d',' -f1)
          git sparse-checkout add "imagequeue/$CURRENT_IMAGE"
          git checkout "imagequeue/$CURRENT_IMAGE"
          echo "Current image being posted: $CURRENT_IMAGE"
          NEW_IMAGE=$(yarn --silent run start)
          if [ -n "$NEW_IMAGE" ] && [ "$NEW_IMAGE" != "$CURRENT_IMAGE" ]; then
            echo "Successfully posted. Updating LAST_IMAGE_NAME to $NEW_IMAGE"
            gh variable set LAST_IMAGE_NAME --body "$NEW_IMAGE"
          else
            echo "Error: Script returned same image or empty string ($NEW_IMAGE). Check script logic."
            exit 1
          fi
